<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>页面不存在 · bihongcue876</title>
<style>
  :root{ --bg:#f8f5ef; --fg:#1d1b18; --muted:#6d665c; --accent:#1d1b18; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141312; --fg:#e8e3d9; --muted:#9b9285; --accent:#e8e3d9; }
  }
  *{ box-sizing:border-box }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    padding:32px 20px; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg);
    font:16px/1.6 Georgia, "Times New Roman", "Iowan Old Style",
         "Songti SC", "Noto Serif SC", "Noto Serif CJK SC",
         "Source Han Serif SC", "SimSun", serif;
  }
  main{ max-width:26rem; text-align:center }
  p.code{ margin:0 0 8px; font-size:3rem; font-weight:600; letter-spacing:.04em; color:var(--muted) }
  p.msg{ margin:0 0 26px; color:var(--muted) }
  a{ color:var(--fg); text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px }
  a:hover{ color:var(--accent) }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:2px }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <p class="msg">这个地址下没有页面。</p>
  <a href="/">回首页</a>
</main>
</body>
</html>
